<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>My Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ===== 图标侧栏 ===== -->
    <aside id="sidebar">
      <div id="sidebar-logo" title="My Agent" data-nav="chat">M</div>
      <nav id="sidebar-nav">
        <div class="sidebar-icon active" data-nav="chat"
             data-i18n-title="sidebar.new_chat" data-icon="message-square"></div>
        <div class="sidebar-icon" data-nav="sessions"
             data-i18n-title="sidebar.conversations" data-icon="list"></div>
        <div class="sidebar-icon" data-nav="skills"
             data-i18n-title="sidebar.skills" data-icon="puzzle"></div>
        <div class="sidebar-icon" data-nav="settings"
             data-i18n-title="sidebar.settings" data-icon="settings"></div>
      </nav>
      <div id="sidebar-footer">
        <div id="sidebar-avatar" title="用户">Q</div>
      </div>
    </aside>

    <!-- ===== 会话列表面板（仅对话页显示） ===== -->
    <aside id="session-panel">
      <div class="session-panel-header">
        <span class="session-panel-title" data-i18n="sidebar.conversations">对话</span>
        <button class="btn btn-icon btn-ghost" id="btn-new-session"
                data-i18n-title="sessions.new" data-icon="plus"></button>
      </div>
      <div class="session-panel-search">
        <input class="input input-search" id="session-search"
               data-i18n-placeholder="sessions.search" placeholder="搜索对话">
      </div>
      <div class="session-list" id="session-list"></div>
      <div class="session-panel-footer">
        <span id="session-count">共 0 个对话</span>
        <span class="btn btn-ghost btn-sm" data-nav="sessions" data-i18n="sidebar.manage">管理</span>
      </div>
      <div id="session-panel-resize-handle" class="resize-handle"></div>
    </aside>

    <!-- ===== 主区 ===== -->
    <main id="main">
      <!-- 对话页 -->
      <section id="page-chat" class="page active">
        <div id="chat-topbar">
          <div class="chat-topbar-left">
            <span class="chat-topbar-title" id="chat-title" data-i18n="chat.title">新对话</span>
          </div>
          <div class="chat-topbar-right">
            <span class="chip" id="topbar-model">🧠 deepseek-chat</span>
            <span id="topbar-tokens" style="cursor:pointer;">📊 0</span>
            <span id="topbar-tools" style="cursor:pointer;">🔄 0</span>
            <button class="btn btn-icon btn-ghost" data-icon="info"></button>
          </div>
        </div>
        <div id="chat-messages">
          <div class="empty-state">
            <div class="empty-state-icon">
              <span data-icon="message-square" data-icon-size="36"></span>
            </div>
            <div data-i18n="chat.empty">开始一段新对话</div>
            <div style="margin-top:4px;font-size:12px;" data-i18n="chat.empty_hint">Enter 发送，Shift+Enter 换行</div>
          </div>
        </div>
        <div id="chat-input-area">
          <div class="input-context-bar">
            <span class="chip" id="ctx-project">📁 my-agent ⌄</span>
            <span class="chip" id="ctx-model">🧠 deepseek-chat ⌄</span>
            <span class="chip" id="ctx-tools" data-i18n="chat.tools_enabled">工具已启用</span>
          </div>
          <div class="input-wrapper">
            <textarea id="chat-input" rows="2"
              data-i18n-placeholder="chat.placeholder"
              placeholder="输入消息... Enter 发送，Shift+Enter 换行"></textarea>
            <div class="input-toolbar">
              <div class="input-toolbar-left">
                <button class="btn btn-icon btn-ghost" data-i18n-title="chat.attachment" data-icon="paperclip"></button>
                <button class="btn btn-icon btn-ghost" data-i18n-title="chat.slash_cmd" data-icon="slash"></button>
              </div>
              <div class="input-toolbar-right">
                <button class="btn btn-sm btn-secondary" id="btn-stop" data-i18n="chat.stop">停止</button>
                <button class="btn btn-primary" id="btn-send" data-i18n="chat.send">发送 ➤</button>
              </div>
            </div>
          </div>
          <div style="text-align:center;font-size:11px;color:#bbb;margin-top:8px;" data-i18n="chat.disclaimer">
            My Agent 可能产生错误，请核实重要信息
          </div>
        </div>
      </section>

      <!-- 会话管理页 -->
      <section id="page-sessions" class="page">
        <div class="topbar">
          <div class="topbar-title">
            <h2 style="margin:0;font-size:18px;" data-i18n="sessions.title">会话管理</h2>
            <span id="sessions-stats" style="color:#999;font-size:13px;">共 0 个会话</span>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-secondary" data-i18n="sessions.export_all">📥 导出全部</button>
            <button class="btn btn-primary" id="btn-new-session-2" data-i18n="sessions.new">＋ 新建</button>
          </div>
        </div>

        <div id="sessions-filter-bar">
          <input class="input" id="sessions-search" data-i18n-placeholder="sessions.search" placeholder="搜索会话标题或内容...">
          <select class="select" id="sessions-filter-project">
            <option value="" data-i18n="sessions.filter_project">全部项目</option>
          </select>
          <select class="select" id="sessions-filter-time">
            <option value="" data-i18n="sessions.filter_time">全部时间</option>
            <option value="today">今天</option>
            <option value="week">本周</option>
            <option value="month">本月</option>
          </select>
        </div>

        <div id="sessions-batch-bar">
          <div class="batch-bar-info">
            <span class="batch-bar-count" id="batch-count">已选 0 个会话</span>
          </div>
          <div class="batch-bar-actions">
            <button class="btn btn-secondary btn-sm" id="btn-batch-archive" data-i18n="sessions.archive">📦 归档</button>
            <button class="btn btn-secondary btn-sm" id="btn-batch-export" data-i18n="sessions.export">📥 导出</button>
            <button class="btn btn-danger btn-sm" id="btn-batch-delete" data-i18n="sessions.delete">🗑️ 删除</button>
          </div>
        </div>

        <div id="sessions-table-wrap">
          <table id="sessions-table">
            <thead>
              <tr>
                <th class="col-checkbox"><input type="checkbox" id="select-all"></th>
                <th data-i18n="sessions.col_session">会话</th>
                <th data-i18n="sessions.col_project">项目</th>
                <th data-i18n="sessions.col_model">模型</th>
                <th class="col-count" data-i18n="sessions.col_messages">消息</th>
                <th class="col-tokens" data-i18n="sessions.col_tokens">Token</th>
                <th data-i18n="sessions.col_updated">更新时间</th>
                <th class="col-actions" data-i18n="sessions.col_actions">操作</th>
              </tr>
            </thead>
            <tbody id="sessions-tbody"></tbody>
          </table>
        </div>

        <div id="sessions-pagination">
          <span id="pagination-info">显示 0 - 0 / 0</span>
          <div class="pagination-btns" id="pagination-btns"></div>
        </div>
      </section>

      <!-- Skills 管理页 -->
      <section id="page-skills" class="page">
        <div class="topbar">
          <div class="topbar-title">
            🧩 <span data-i18n="skills.title">Skills 管理</span>
            <span id="skills-stats" style="color:#999;font-size:13px;font-weight:400;">已启用 0 / 0</span>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-secondary" data-i18n="skills.install">📥 从市场安装</button>
            <button class="btn btn-secondary" data-i18n="skills.open_dir">📂 打开目录</button>
            <button class="btn btn-primary" data-i18n="skills.new">＋ 新建 Skill</button>
          </div>
        </div>

        <div class="skills-chip-bar">
          <span style="font-size:12px;color:#999;margin-right:4px;">分类：</span>
          <button class="chip active" data-category="all" data-i18n="skills.filter_all">全部</button>
          <button class="chip" data-category="开发">💻 开发</button>
          <button class="chip" data-category="写作">📝 写作</button>
          <button class="chip" data-category="数据">📊 数据</button>
          <button class="chip" data-category="研究">🔍 研究</button>
          <button class="chip" data-category="创意">🎨 创意</button>
          <label style="margin-left:auto;font-size:12px;color:#666;display:flex;align-items:center;gap:4px;cursor:pointer;">
            <input type="checkbox" id="show-enabled-only" style="accent-color:var(--color-primary);">
            <span data-i18n="skills.enabled_only">仅显示已启用</span>
          </label>
        </div>

        <div class="content-area" id="skills-grid"></div>
      </section>

      <!-- 设置页 -->
      <section id="page-settings" class="page" style="flex-direction:row;">
        <nav id="settings-subnav">
          <div class="settings-subnav-label" data-i18n="settings.title">设置</div>
          <div class="settings-subnav-item active" data-tab="models" data-i18n="settings.models">🤖 模型</div>
          <div class="settings-subnav-item" data-tab="tools" data-i18n="settings.tools">🔧 工具</div>
          <div class="settings-subnav-item" data-tab="paths" data-i18n="settings.paths">📁 路径与权限</div>
          <div class="settings-subnav-item" data-tab="context" data-i18n="settings.context">🧠 上下文</div>
          <div class="settings-subnav-item" data-tab="appearance" data-i18n="settings.appearance">🎨 外观</div>
          <div class="settings-subnav-item" data-tab="developer" data-i18n="settings.developer">🧪 开发者</div>
          <div id="settings-version">v0.3.0 · Electron 33</div>
        </nav>
        <div id="settings-main">
          <div class="topbar" style="border-bottom:1px solid var(--border-light);">
            <h2 style="margin:0;font-size:18px;" id="settings-tab-title">🤖 模型设置</h2>
          </div>
          <div class="settings-content" id="settings-content"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ============================================================
       Scripts（顺序即依赖序）
       ============================================================ -->

  <!-- vendor -->
  <script src="js/vendor/dompurify/purify.min.js"></script>
  <script src="js/vendor/marked.min.js"></script>

  <!-- shared（按依赖顺序） -->
  <script src="js/shared/logger.js"></script>
  <script src="js/shared/icons.js"></script>
  <script src="js/shared/utils.js"></script>
  <script src="js/shared/i18n.js"></script>
  <script src="js/shared/markdown.js"></script>

  <!-- state -->
  <script src="js/state/state.js"></script>

  <!-- ipc -->
  <script src="js/ipc/ipc-shim.js"></script>
  <script src="js/ipc/api.js"></script>

  <!-- components（依赖 shared/state/ipc，先于 features 加载） -->
  <script src="js/components/dialogs.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/context-menu.js"></script>
  <script src="js/components/chat-input-form.js"></script>

  <!-- features -->
  <script src="js/features/chat.js"></script>
  <script src="js/features/sessions.js"></script>
  <script src="js/features/skills.js"></script>
  <script src="js/features/settings.js"></script>

  <!-- app 入口（最后加载） -->
  <script src="js/app.js"></script>

  <!-- 启动后：用 SVG 图标替换 data-icon 占位元素 -->
  <script>
    (function fillIcons() {
      var els = document.querySelectorAll('[data-icon]');
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        var name = el.dataset.icon;
        var size = el.dataset.iconSize || '16';
        if (typeof uiIconHtml === 'function') {
          el.innerHTML = uiIconHtml(name);
          // 调整尺寸
          var svg = el.querySelector('svg');
          if (svg) {
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
          }
        }
      }
      // 处理 data-icon-title（在 span 或 button 内部放图标）
      var titleEls = document.querySelectorAll('[data-i18n-title]');
    })();
  </script>
</body>
</html>
