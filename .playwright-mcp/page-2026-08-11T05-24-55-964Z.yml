                  - paragraph [ref=f4e338]: "* GitHub 标记为 NOASSERTION（非标准开源许可证），需自行查阅仓库 LICENSE 确认条款。"
                  - heading "分类详解与选型建议" [level=2] [ref=f4e339]
                  - paragraph [ref=f4e340]:
                    - strong [ref=f4e341]: ① 本地推理引擎（基础设施，几乎必装）
                  - list [ref=f4e342]:
                    - listitem [ref=f4e343]:
                      - strong [ref=f4e344]: Ollama
                      - text: （MIT）：一键安装、命令行 + API 方式运行 Qwen、DeepSeek、Gemma、GLM 等开源模型，支持 OpenAI 兼容接口。它不是 GUI，但几乎所有开源桌面客户端都内置了对它的支持。想完全离线跑模型，它是第一选择。
                  - paragraph [ref=f4e345]:
                    - strong [ref=f4e346]: ② 本地优先的桌面 GUI
                  - list [ref=f4e347]:
                    - listitem [ref=f4e348]:
                      - strong [ref=f4e349]: Jan
                      - text: ：类 ChatGPT 界面，纯本地推理（基于 llama.cpp），也支持接远程 API。界面精美，Tauri 构建、体积小。注意其许可证带附加条款。
                    - listitem [ref=f4e350]:
                      - strong [ref=f4e351]: GPT4All
                      - text: ：老牌本地 GUI，支持商用。但仓库最后推送是 2025-05-27，
                      - strong [ref=f4e352]: 活跃度是明确风险
                      - text: ，新模型支持可能滞后，选它前请确认自己的模型是否在支持列表内。
                  - paragraph [ref=f4e353]:
                    - strong [ref=f4e354]: ③ 多模型聚合客户端（接 API 为主，也可接本地）
                  - list [ref=f4e355]:
                    - listitem [ref=f4e356]:
                      - strong [ref=f4e357]: Chatbox
                      - text: （GPL-3.0）：界面最简洁的"万能客户端"，一个对话里混用多家模型，iOS/桌面/Web 全平台。GPL 对个人使用无影响。
                    - listitem [ref=f4e358]:
                      - strong [ref=f4e359]: Cherry Studio
                      - text: （AGPL-3.0）：功能最重的国产项目，内置 300+ 助手模板、智能体（Claude Code、Codex、DeepSeek 等）、vibe coding 支持。AGPL 意味着你若二次开发并对外提供服务需开源，商用注意。
                  - paragraph [ref=f4e360]:
                    - strong [ref=f4e361]: ④ RAG / 智能体平台
                  - list [ref=f4e362]:
                    - listitem [ref=f4e363]:
                      - strong [ref=f4e364]: AnythingLLM
                      - text: （MIT，最宽松）：把文档喂给模型做知识库问答的成熟方案，支持向量库、多用户；适合企业或个人知识管理。
                    - listitem [ref=f4e365]:
                      - strong [ref=f4e366]: LobeHub
                      - text: ：定位已从聊天演变为"AI 团队运营平台"（Agent Operator），功能最前沿但主要为 Web 形态，桌面端是封装壳。
                  - paragraph [ref=f4e367]:
                    - strong [ref=f4e368]: ⑤ 值得关注的新兴项目
                    - text: （star 量级小，更新活跃）
                  - list [ref=f4e369]:
                    - listitem [ref=f4e370]:
                      - strong [ref=f4e371]: talkio
                      - text: （Tauri 2 + React）：本地优先的多模型群聊桌面应用，一个对话同时接入 GPT/Claude/Gemini/DeepSeek。
                    - listitem [ref=f4e372]:
                      - strong [ref=f4e373]: Chaty
                      - text: （Rust + TS）：设备端 GGUF/MLX 模型 + 本地编码智能体 + RAG + 深度研究。
                    - listitem [ref=f4e374]:
                      - strong [ref=f4e375]: Soul-of-Waifu
                      - text: ：带 Live2D/VRM 虚拟形象的 AI 角色扮演桌面应用（Python，1.2k star，昨日仍有更新）。
                  - heading "需要留意的坑" [level=2] [ref=f4e376]
                  - list [ref=f4e377]:
                    - listitem [ref=f4e378]:
                      - strong [ref=f4e379]: 许可证
                      - text: ：GitHub 上 Jan、LobeHub 的许可证被标记为 NOASSERTION（自定义条款），Cherry Studio 是 AGPL；个人/内部使用无碍，但
                      - strong [ref=f4e380]: 产品化、商用前务必核对 LICENSE 原文
                      - text: 。最省心的商用选择是 MIT 的 AnythingLLM 和 Ollama。
                    - listitem [ref=f4e381]:
                      - strong [ref=f4e382]: 活跃度
                      - text: ：GPT4All 14 个月无提交；Ollama、Cherry Studio、AnythingLLM 当日（2026-08-11）仍在推送，活跃度健康。
                    - listitem [ref=f4e383]:
                      - strong [ref=f4e384]: LM Studio 未纳入
                      - text: ：其仓库不存在（
                      - code [ref=f4e385]: lmstudio-ai/lmstudio
                      - text: 返回 404），确认是闭源软件，只是免费分发，不符合"开源"标准。
                  - paragraph [ref=f4e386]: 如果你有具体的使用场景（如完全离线、知识库、多模型聚合、商用），我可以基于此再给出针对性的配置建议。
