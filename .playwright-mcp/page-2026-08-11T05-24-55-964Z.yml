                  - heading "结论先行" [level=2] [ref=f4e271]
                  - paragraph [ref=f4e272]:
                    - text: 开源 AI 桌面应用生态已经相当成熟，核心玩家分三类：
                    - strong [ref=f4e273]: 本地推理引擎
                    - text: （Ollama）、
                    - strong [ref=f4e274]: 本地优先的桌面聊天客户端
                    - text: （Jan、GPT4All）、
                    - strong [ref=f4e275]: 多模型聚合客户端
                    - text: （Chatbox、Cherry Studio），以及向
                    - strong [ref=f4e276]: RAG / 多智能体平台
                    - text: 演进的 AnythingLLM、LobeHub。若只选一个，
                    - strong [ref=f4e277]: Ollama + Jan
                    - text: 是最稳妥的本地组合；若主要用各家云端 API，
                    - strong [ref=f4e278]: Cherry Studio 或 Chatbox
                    - text: 体验最好。需注意两点：GPT4All 已一年多未更新；Jan、LobeHub、Cherry Studio 的许可证并非纯 MIT/Apache，商用前需核实条款。
