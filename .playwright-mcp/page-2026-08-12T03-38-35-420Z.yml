                        - generic [ref=f11e771]: "📄 AGENTS.md (89 行, 4441 字符) 1| <!-- 自主性指令 — 请勿删除 --> 2| 你是一个自主编码代理。**自主性仅适用于实现阶段**，且须满足全部条件： 3| 1. 用户在本会话**已单独说过**「开始实现 / 直接做 / 并行执行」（或等价），**或** spec/plan FM 已 `approved: true` 且引用该授权原话； 4| 2. **不**含同句组合指令里的「然后执行」（见 `routing.md` § 组合指令）； 5| 3. 当前任务 **非**「写方案 / 写计划」阶段。 6| 满足后无需逐步征求许可，执行至完成（Tier 2+ 仍须尾盘产物）。 7| **Harness 阶段门禁优先：** 写入 spec / plan / decision 后须暂停；「写方案」「写计划」不属于实现阶段，未获用户继续指令前不得 auto-continue 改代码。详见 `routing.md` § 阶段门禁。Cursor 平台额外见 `.cursor/rules/ai-entry.mdc` § 文件写入与阶段门禁。 8| **Harness 尾盘优先（Cursor）：** 「完成」指本 GROUP / 批次已通过**集体测试**与**集体审查**并落盘（`collective-test` + `code-review`），而非末个 WU 返回即可停。见 `harness-kit/docs/superpowers/specs/2026-05-28-batch-closeout-review-and-collective-test.md`。 9| **Tier 1 Leader 直做：** 须 Write `verifications/*-verification-lite.md`，不得零落盘。见 `routing.md` § 任务 Tier。 10| 若受阻，尝试替代方案。仅在真正歧义或具有破坏性时才提问。 11| 并行子任务：Cursor 用 `.agents/agents/<role>.md` 共享 subagent（见 `harness-kit/.agents/`）；Claude / Trae 同理。 12| <!-- 自主性指令结束 --> 13| 14| <!-- 项目 Harness 覆盖层 — 请勿删除 --> 15| 在开展任务专项工作之前，按 **Route-first** 加载 `harness-kit/`（勿预读全集）。 16| 17| ## 加载规则 18| 19| 1. **始终**：`harness-kit/core/routing.md`（路由判定、阶段门禁、§ 按判定加载） 20| 2. **按 routing 判定追加**（见 `routing.md` § 按判定加载；**先 stage skill，再 artifacts 契约**）： 21| - 设计 / spec → Load **`brainstorming`** → `artifacts.md`（勿用 `artifact-templates/spec.md` 作正文） 22| - 计划 → Load **`writing-plans`** → `artifacts.md` + `plan.harness-overlay.md`；并行时 `dispatch.harness-overlay.md` 23| - 验证 → Load **`verification-before-completion`** → `project.verification.md`、`core/verification.md` 24| - 编排产物（execution-log、track 等）→ `artifact-templates/` 对应文件 25| - 改代码前 → `project.profile.md`、`context-map.md`（涉及模块时） 26| - Git → **`git-xywh` skill** + `project.git.md` 27| - runbook 任务 → `core/runbooks.md` 对应节 28| 3. **架构总览（可选）**：`core/harness.md` 29| 30| `harness-kit/` 层负责项目边界、产物契约、验证门禁与迁移可移植性。 31| 默认 harness 路由是强制基线。若用户指定技能或工具，将其视为对 `harness-kit/core/routing.md` 的附加项，除非用户明确要求跳过、禁用或仅使用其他路由。 32| 33| 34| <!-- 项目 Harness 覆盖层结束 --> 35| 36| # Agent Harness 顶层契约 37| 38| 本文件是**工具中立**的 Harness 入口。平台专章分列，避免 Cursor 误读其他平台指令。 39| 40| ## 平台专章 41| 42| | 平台 | 加载 | 43| | --- | --- | 44| | **Cursor** | `harness-kit/entrypoints/AGENTS.cursor-overlay.md`、`.cursor/rules/`、`.agents/agents/`、`orchestration` skill | 45| | **Claude Code** | `CLAUDE.md`、`orchestration` skill、`adapters/claude/bindings.md` | 46| 47| ## 强制声明 48| 49| 每个任务第一句：`「Harness：<route 或 Tier 0/1>」`；stage skill / Tier 1+ 次行 `Skills:`（见 `routing.md` § 阶段指定 skill 必用）。 50| 路由表见 `harness-kit/core/routing.md`（含 Capability / Cursor / Claude 列）。 51| 52| ## 路由摘要 53| 54| | 任务 | Cursor | Claude | 55| | --- | --- | --- | 56| | 设计 | `superpowers:brainstorming` | 同左 | 57| | 计划 | `superpowers:writing-plans` | 同左 | 58| | 多 task 实现 | `orchestration` | `orchestration` | 59| | 验证 / 集体测试 | `superpowers:verification-before-completion` | 同左 | 60| | 尾盘（批次收尾） | `verification-before-completion` → `requesting-code-review` | 同左 | 61| | 信息调研 | `web-investigator` | Task + web-investigator | 62| | Git（提交 / 分支 / MR） | `git-xywh` + `project.git.md` | 同左 | 63| 64| 涉及提交、分支、MR 时由 **Leader** invoke `git-xywh`；子 Agent 默认不 commit。组织规范在 skill，项目差异在 `project.git.md`。 65| 66| ## 可选：Cursor Hooks 67| 68| 启用 Harness 路由提示 hook：见 `harness-kit/adapters/cursor/.cursor/hooks/README.md`。 69| 70| ## 参考资料索引 71| 72| 以下参考资料统一存放在 `harness-kit/references/`（集中式）。**不是\"按需参考\"，而是对应阶段路由的强制门禁。** Leader 进入路由时必须 Read 关联 references 并逐项对照执行（见 `routing.md` § 参考资料强制加载）。 73| 74| | 文件 | 用途 | 被引用的 skill | 75| |------|------|---------------| 76| | `harness-kit/references/definition-of-done.md` | 项目级完成定义（20+ 检查项） | `verification-before-completion`, `incremental-implementation`, `shipping-and-launch` | 77| | `harness-kit/references/testing-patterns.md` | 测试模式（AAA、Mock 层次、反模式） | `test-driven-development`, `debugging-and-error-recovery` | 78| | `harness-kit/references/security-checklist.md` | Web 安全 + OWASP/LLM Top 10 | `security-and-hardening`, `code-review-and-quality`, `shipping-and-