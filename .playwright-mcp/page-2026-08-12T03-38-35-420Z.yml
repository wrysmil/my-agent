                        - generic [ref=f11e712]: "📄 README.md (174 行, 4185 字符) 1| # My Agent 2| 3| LLM Agent 运行时框架 - 从零搭建学习项目。 4| 5| ## 特性 6| 7| - **数字彩菜单 CLI** — 启动后进入主菜单，6 色循环编号，一键切换/配置/查看 8| - **本地 Provider 配置** — 在 `~/.my-agent/providers.json` 维护多个模型提供商，零环境变量 9| - **DeepSeek 适配** — 流式 / 非流式 / 工具调用 / 错误映射 10| - **持久化会话** — JSONL 消息存档 + 上下文侧车，可恢复历史对话 11| 12| ## 项目结构 13| 14| ``` 15| my-agent/ 16| ├── src/ 17| │ ├── shared/ # 错误、类型、日志（零依赖） 18| │ ├── config/ # Zod schema 配置 19| │ ├── tools/ # 工具抽象层 20| │ ├── providers/ # LLM Provider 适配层 21| │ ├── agent/ # Agent 主循环 22| │ ├── cli/ # 数字彩菜单 + 表单 23| │ ├── storage/ # JSON / JSONL 持久化 24| │ └── prompts/ # System Prompt 模板 25| ├── harness-kit/ # Harness-Kit 工程规范 26| └── tests/ # 单测 + 集成测试 27| ``` 28| 29| ## 技术栈 30| 31| - **TypeScript** + **Node.js** (ESM, NodeNext) 32| - **Zod** - 运行时配置校验 33| - **Vitest** - 测试框架 34| - **tsx** - TypeScript 直接执行 35| - **原生 ANSI 转义序列** - 数字彩菜单（无 chalk 依赖） 36| 37| ## 快速开始 38| 39| ```bash 40| npm install 41| npm run chat 42| ``` 43| 44| 首次运行会自动创建 `~/.my-agent/providers.json` 并预填 DeepSeek。进入主菜单后选 ② 设置 API Key。 45| 46| ## 数字彩菜单 47| 48| ``` 49| ┌───────────────────────────────────────┐ 50| │ 🤖 My Agent — 主菜单 │ 51| └───────────────────────────────────────┘ 52| 53| 当前: deepseek (DeepSeek) [启用] 54| 55| ① 开始对话 56| ② 设置模型提供商 57| ③ 查看当前提供商 58| ④ 退出 59| 60| 请选择 (1-4): 61| ``` 62| 63| **设置子菜单**（选 ② 进入）： 64| 65| ``` 66| ① 列出所有提供商 67| ② 修改当前提供商 68| ③ 切换当前提供商 69| ④ 启用 / 禁用 70| ⑤ 删除提供商 71| ⑥ 返回上级 72| ``` 73| 74| ## Provider 配置 75| 76| 存储路径：`~/.my-agent/providers.json`（文件权限 `0o600`） 77| 78| 可通过环境变量 `MY_AGENT_HOME` 覆盖根目录。 79| 80| ```json 81| { 82| \"version\": 1, 83| \"activeProviderId\": \"deepseek\", 84| \"providers\": { 85| \"deepseek\": { 86| \"id\": \"deepseek\", 87| \"name\": \"DeepSeek\", 88| \"type\": \"deepseek\", 89| \"apiKey\": \"sk-xxxxx\", 90| \"baseUrl\": \"https://api.deepseek.com/v1\", 91| \"defaultModel\": \"deepseek-chat\", 92| \"enabled\": true 93| } 94| } 95| } 96| ``` 97| 98| ## CLI 命令 99| 100| ```bash 101| npm run chat # 主菜单（默认） 102| npx tsx chat.ts --list # 列出历史会话 103| npx tsx chat.ts --load <id> # 恢复指定会话（跳过菜单） 104| ``` 105| 106| 对话内命令（输入 `/help` 查看）： 107| 108| - `/quit` `/exit` — 退出 109| - `/clear` — 清空上下文（新建 session） 110| - `/save` — 显示当前 session ID 111| - `/tools` — 列出所有工具 112| - `/skills` — 列出所有 Skill 113| - `/skill <id>` — 查看 Skill 详细内容 114| 115| ## Web 模式 116| 117| 除 CLI 外，亦提供浏览器版，启动后默认监听 `http://localhost:4321`。 118| 119| ### 启动 120| 121| ```bash 122| npm run web # 启动 Web 模式（默认端口 4321） 123| npx my-agent-web # 等价命令 124| ``` 125| 126| 启动后，`open-browser` 模块会**自动唤起默认浏览器**（macOS / Linux / Windows 跨平台支持）；若需手动打开，请访问 <http://localhost:4321>。 127| 128| ### 主要功能 129| 130| - **会话管理** — 新建 / 列表 / 重命名 / 删除 / 导出 131| - **Chat** — SSE 流式响应 + Markdown 渲染 + 工具调用卡片 132| - **Provider 管理** — DeepSeek 等多 provider 切换与配置 133| - **Agent / Skill 启动** — 一键拉起已注册的 Agent 与 Skill 134| - **上下文压缩** — `/session-compact` 滑动窗口式摘要 135| - **主题与 i18n** — 主题 `auto / light / dark`；i18n `zh / en` 136| 137| ### 快捷键 138| 139| | 快捷键 | 作用 | 140| | --- | --- | 141| | `Cmd/Ctrl+K` | 命令面板 | 142| | `Cmd/Ctrl+N` | 新建会话 | 143| | `Cmd/Ctrl+,` | 打开设置 | 144| | `Cmd/Ctrl+/` | 主菜单 | 145| | `Cmd/Ctrl+B` | 切换侧栏 | 146| | `Cmd/Ctrl+.` | 停止生成 | 147| | `Cmd/Ctrl+Enter` | 发送（Chat composer 内） | 148| | `Esc` | 关闭最上层 modal | 149| 150| ### 安全 151| 152| - **CSP / SRI** — `index.html` 声明严格 CSP，所有外链资源均带 `integrity` + `crossorigin` 153| - **零运行时依赖** — 仅 vanilla HTML / CSS / JS，无打包器、无运行时 npm 依赖 154| - **vendor 本地化** — `marked` / `DOMPurify` 等第三方库全部本地化（位于 `web/js/vendor/`），离线可用、可审计 155| - **API Key 隔离** — 与 CLI 共用 `~/.my-agent/providers.json`，前端不持久化原始 Key 156| 157| > 截图占位：<img src=\"docs/screenshots/web-home.png\" alt=\"Web home — 主菜单\"> 158| > 159| > （截图待 PR 补；提交前请将 `docs/screenshots/web-home.png` 加入 PR） 160| 161| ## 开发 162| 163| ```bash 164| npm test # 跑全量测试 165| npm run check # TypeScript 类型检查 166| npm run chat # 启动 CLI 167| ``` 168| 169| ## 文档 170| 171| - 设计规范：[`.ai-runtime-artifacts/specs/2026-08-05-cli-menu-and-provider-config.md`](.ai-runtime-artifacts/specs/2026-08-05-cli-menu-and-provider-config.md) 172| - 实施计划：[`.ai-runtime-artifacts/plans/2026-08-05-cli-menu-and-provider-config-plan.md`](.ai-runtime-artifacts/plans/2026-08-05-cli-menu-and-provider-config-plan.md) 173| - 验证产物：[`.ai-runtime-artifacts/verifications/2026-08-05-cli-menu-and-provider-config-verification.md`](.ai-runtime-artifacts/verifications/2026-08-05-cli-menu-and-provider-config-verification.md) 174|"
