    - main [ref=f12e66]:
      - generic [ref=f12e1227]:
        - generic [ref=f12e1228]:
          - heading "工具" [level=1] [ref=f12e1229]
          - paragraph [ref=f12e1230]: 共 10 个工具
        - generic [ref=f12e1231]:
          - generic [ref=f12e1232] [cursor=pointer]:
            - heading "read_file" [level=3] [ref=f12e1234]
            - paragraph [ref=f12e1235]: 读取文件内容。支持指定行号范围和字符范围，支持文本文件（PDF/二进制文件请用其他工具）。
          - generic [ref=f12e1236] [cursor=pointer]:
            - heading "write_file" [level=3] [ref=f12e1238]
            - paragraph [ref=f12e1239]: 将内容写入文件。如果文件已存在则覆盖，父目录自动创建。写入内容为 UTF-8 文本。
          - generic [ref=f12e1240] [cursor=pointer]:
            - heading "edit_file" [level=3] [ref=f12e1242]
            - paragraph [ref=f12e1243]: 对现有文件进行精确的字符串替换（old_string → new_string）。old_string 必须在文件中唯一匹配（如不唯一则报错，需提供更多上下文使其唯一）。
          - generic [ref=f12e1244] [cursor=pointer]:
            - heading "delete_file" [level=3] [ref=f12e1246]
            - paragraph [ref=f12e1247]: 删除文件（仅限工作区/允许根内）。⚠️ 不可恢复，请谨慎使用。
          - generic [ref=f12e1248] [cursor=pointer]:
            - heading "list_files" [level=3] [ref=f12e1250]
            - paragraph [ref=f12e1251]: 列出目录中的文件和子目录。支持递归展开（默认 2 层深度）。
          - generic [ref=f12e1252] [cursor=pointer]:
            - heading "search_files" [level=3] [ref=f12e1254]
            - paragraph [ref=f12e1255]: 按文件名/glob 模式在工作目录中搜索文件。
          - generic [ref=f12e1256] [cursor=pointer]:
            - heading "grep_files" [level=3] [ref=f12e1258]
            - paragraph [ref=f12e1259]: 在工作目录的文件内容中搜索文本/正则表达式。自动跳过 node_modules、.git 和二进制文件。
          - generic [ref=f12e1260] [cursor=pointer]:
            - heading "stat_file" [level=3] [ref=f12e1262]
            - paragraph [ref=f12e1263]: 获取文件元信息：大小、行数、字符数。不读取完整文件内容。超过 64KB 的文件仅报告字节数。
          - generic [ref=f12e1264] [cursor=pointer]:
            - heading "bash" [level=3] [ref=f12e1266]
            - paragraph [ref=f12e1267]: 执行 shell 命令并返回输出。命令在子进程中执行，默认超时 30 秒。注意：此操作具有副作用。
          - generic [ref=f12e1268] [cursor=pointer]:
            - heading "web_fetch" [level=3] [ref=f12e1270]
            - paragraph [ref=f12e1271]: 获取指定 URL 的网页内容并提取文本。适用于阅读文档、API 响应等。不支持需要登录的页面。