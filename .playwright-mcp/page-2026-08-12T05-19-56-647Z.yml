                      - row [ref=f16e1163]:
                        - cell [ref=f16e1164]:
                          - strong [ref=f16e1165]: AnythingLLM
                          - text: (Mintplex-Labs)
                        - cell "64.6k" [ref=f16e1166]
                        - cell "MIT" [ref=f16e1167]
                        - cell "Electron + React/Node" [ref=f16e1168]
                        - cell "全能型：文档 RAG + AI Agent + 多用户；支持 30+ LLM 提供商和 10+ 向量库；动态模型路由、定时任务、MCP；Docker 可部署为团队服务" [ref=f16e1169]
                      - row [ref=f16e1170]:
                        - cell [ref=f16e1171]:
