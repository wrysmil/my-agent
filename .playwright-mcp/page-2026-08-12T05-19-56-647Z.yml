                - generic [ref=f16e1119]:
                  - paragraph [ref=f16e1120]: 我来研究开源 AI 桌面应用的最新情况。先搜索获取信息。 GitHub topic 页面结果较杂，我来针对几个主流开源 AI 桌面应用逐一核实最新信息。 已获取 AnythingLLM 和 Jan 的信息。继续核实 Cherry Studio 和 Chatbox。 再核实 GPT4All 和 Lobe Chat 两个项目。 调研完成，以下是截至 2026-08-12 的开源 AI 桌面应用研究报告（数据来自各项目 GitHub 主页实时抓取）。
                  - heading "开源 AI 桌面应用研究报告" [level=1] [ref=f16e1121]
                  - heading "结论先行" [level=2] [ref=f16e1122]
                  - paragraph [ref=f16e1123]:
                    - text: 当前开源 AI 桌面应用已形成两条清晰路线：
                    - strong [ref=f16e1124]: 本地优先
                    - text: （完全离线跑模型，隐私至上）和
                    - strong [ref=f16e1125]: BYOK 客户端
                    - text: （自带密钥接各家云端 API）。市场格局稳定，头部项目 Star 数均在 4 万以上，其中
                    - strong [ref=f16e1126]: GPT4All、LobeHub
                    - text: 领跑（7.7 万+/8.1 万+），
                    - strong [ref=f16e1127]: AnythingLLM、Cherry Studio
                    - text: 紧随其后。
                  - heading "主流项目盘点" [level=2] [ref=f16e1128]
                  - heading "🏠 本地优先（离线运行）" [level=3] [ref=f16e1129]
                  - table [ref=f16e1130]:
                    - rowgroup [ref=f16e1131]:
