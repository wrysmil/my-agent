                        - columnheader "核心特点" [ref=f16e1137]
                    - rowgroup [ref=f16e1138]:
                      - row [ref=f16e1139]:
                        - cell [ref=f16e1140]:
                          - strong [ref=f16e1141]: GPT4All
                          - text: (nomic-ai)
                        - cell "77.4k" [ref=f16e1142]
                        - cell "MIT" [ref=f16e1143]
                        - cell "Qt/C++ + llama.cpp" [ref=f16e1144]
                        - cell "CPU 即可跑模型，无需 API 和 GPU；LocalDocs 本地文档问答；支持 DeepSeek R1 蒸馏版；商业可用" [ref=f16e1145]
                      - row [ref=f16e1146]:
                        - cell [ref=f16e1147]:
                          - strong [ref=f16e1148]: Jan
                          - text: (janhq)
                        - cell "44k" [ref=f16e1149]
                        - cell "Apache 2.0" [ref=f16e1150]
                        - cell "Tauri/Rust" [ref=f16e1151]
                        - cell "100% 离线 ChatGPT 替代品；从 HuggingFace 下载模型；内置 OpenAI 兼容 API（localhost:1337）；支持 MCP；也接云端 API" [ref=f16e1152]
                  - heading "🔑 BYOK 多提供商客户端（自带密钥）" [level=3] [ref=f16e1153]
                  - table [ref=f16e1154]:
                    - rowgroup [ref=f16e1155]:
                      - row [ref=f16e1156]:
                        - columnheader "项目" [ref=f16e1157]
                        - columnheader "Star" [ref=f16e1158]
                        - columnheader "许可" [ref=f16e1159]
                        - columnheader "技术栈" [ref=f16e1160]
                        - columnheader "核心特点" [ref=f16e1161]
