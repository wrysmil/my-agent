                  - heading "关键差异点" [level=2] [ref=f16e1192]
                  - list [ref=f16e1193]:
                    - listitem [ref=f16e1194]:
                      - strong [ref=f16e1195]: 许可证注意
                      - text: ：Cherry Studio 是 AGPL-3.0（代码传染性最强，做商业集成需谨慎）；Chatbox 社区版是 GPL-3.0；其余均为宽松许可（MIT/Apache 2.0）。
                    - listitem [ref=f16e1196]:
                      - strong [ref=f16e1197]: 本地模型后端
                      - text: ：几乎所有客户端都通过
                      - strong [ref=f16e1198]: Ollama
                      - text: 或
                      - strong [ref=f16e1199]: LM Studio
                      - text: 对接本地模型——Ollama 本身是 CLI/服务而非图形应用，但它是这个生态的事实标准底座。
