                        - cell "Electron" [ref=f16e1176]
                        - cell "300+ 预置助手；支持 OpenAI/Gemini/Anthropic 及 Claude/Perplexity 网页服务、Ollama 本地模型；MCP、WebDAV 备份；中文社区最活跃" [ref=f16e1177]
                      - row [ref=f16e1178]:
                        - cell [ref=f16e1179]:
