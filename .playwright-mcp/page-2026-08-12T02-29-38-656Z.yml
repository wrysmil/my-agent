                    - listitem [ref=f3e1215]: 但要注意：如果后端 SSE 长连接 + 前端页面刷新，旧连接可能残留（HTTP/1.1 keep-alive 行为），开发期常见"重复事件"现象，这是连接管理问题而非 proxy 问题。
