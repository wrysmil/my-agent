                    - text: 简写字符串形式
                    - strong [ref=f3e1174]: 不会重写路径
                    - text: ，转发时保留完整
                    - code [ref=f3e1175]: /api
                    - text: 前缀：
                  - code [ref=f3e1177]: 浏览器 → GET http://localhost:5173/api/agents ↓ (Vite proxy) 后端 → GET http://localhost:4321/api/agents
                  - paragraph [ref=f3e1178]:
                    - text: 这恰好匹配本项目的后端路由设计（
                    - code [ref=f3e1179]: router.ts
                    - text: 的 21 个路由都以
                    - code [ref=f3e1180]: /api/
                    - text: 开头），所以是正确配置。
                  - paragraph [ref=f3e1181]:
                    - text: ⚠️ 对比：如果后端路由
                    - strong [ref=f3e1182]: 不带
                    - code [ref=f3e1183]: /api
                    - text: 前缀（如后端只有
                    - code [ref=f3e1184]: /agents
                    - text: ），就需要显式重写：
                  - code [ref=f3e1186]:
                    - text: "proxy: { '/api': { target: 'http://localhost:4321', rewrite:"
                    - generic [ref=f3e1187]: (path) =>
                    - text: "path.replace(/^\\/api/, ''), }, },"
                  - heading [level=3] [ref=f3e1188]:
                    - text: "2."
