                    - text: 未设置。这意味着转发时
                    - strong [ref=f3e1194]:
                      - text: Host 请求头保持为
                      - code [ref=f3e1195]: localhost:5173
                    - text: 。
                  - paragraph [ref=f3e1196]: 对本项目影响不大（后端按端口路由，不看 Host），但如果后端依赖 Host 头做虚拟主机/域名校验，就需要显式开启：
                  - code [ref=f3e1198]: "'/api': { target: 'http://localhost:4321', changeOrigin: true, // 把 Host 改写为 localhost:4321 },"
