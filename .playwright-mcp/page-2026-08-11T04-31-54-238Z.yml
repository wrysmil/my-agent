                  - paragraph [ref=e344]: 继续完成调研。我先补全 LobeHub 的数据，并核实几个关键项目的开源状态。 LobeHub 数据被截断，LM Studio 仓库不存在（确认其闭源）。用脚本提取关键字段： 数据已齐备。以下是完整的调研报告。
                  - separator [ref=e345]
                  - heading "开源 AI 桌面应用调研报告" [level=1] [ref=e346]
                  - paragraph [ref=e347]:
                    - strong [ref=e348]: 调研时间
                    - text: ：2026-08-11 ｜
                    - strong [ref=e349]: 数据来源
                    - text: ：GitHub API / 官方仓库（star 数、许可证均为当日实时数据）
                  - heading "结论先行" [level=2] [ref=e350]
                  - paragraph [ref=e351]:
                    - text: 开源 AI 桌面应用生态已经相当成熟，核心玩家分三类：
                    - strong [ref=e352]: 本地推理引擎
                    - text: （Ollama）、
                    - strong [ref=e353]: 本地优先的桌面聊天客户端
                    - text: （Jan、GPT4All）、
                    - strong [ref=e354]: 多模型聚合客户端
                    - text: （Chatbox、Cherry Studio），以及向
                    - strong [ref=e355]: RAG / 多智能体平台
                    - text: 演进的 AnythingLLM、LobeHub。若只选一个，
                    - strong [ref=e356]: Ollama + Jan
                    - text: 是最稳妥的本地组合；若主要用各家云端 API，
                    - strong [ref=e357]: Cherry Studio 或 Chatbox
                    - text: 体验最好。需注意两点：GPT4All 已一年多未更新；Jan、LobeHub、Cherry Studio 的许可证并非纯 MIT/Apache，商用前需核实条款。
