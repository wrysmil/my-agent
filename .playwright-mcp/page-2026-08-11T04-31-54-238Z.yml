                        - cell "41.4k / 4.2k" [ref=e413]
                        - cell "TypeScript" [ref=e414]
                        - cell "GPL-3.0" [ref=e415]
                        - cell "通用 AI 客户端，聚合 Ollama/OpenAI/DeepSeek/Gemini 等" [ref=e416]
                  - paragraph [ref=e417]: "* GitHub 标记为 NOASSERTION（非标准开源许可证），需自行查阅仓库 LICENSE 确认条款。"
                  - heading "分类详解与选型建议" [level=2] [ref=e418]
                  - paragraph [ref=e419]:
                    - strong [ref=e420]: ① 本地推理引擎（基础设施，几乎必装）
                  - list [ref=e421]:
                    - listitem [ref=e422]:
                      - strong [ref=e423]: Ollama
                      - text: （MIT）：一键安装、命令行 + API 方式运行 Qwen、DeepSeek、Gemma、GLM 等开源模型，支持 OpenAI 兼容接口。它不是 GUI，但几乎所有开源桌面客户端都内置了对它的支持。想完全离线跑模型，它是第一选择。
                  - paragraph [ref=e424]:
                    - strong [ref=e425]: ② 本地优先的桌面 GUI
                  - list [ref=e426]:
                    - listitem [ref=e427]:
                      - strong [ref=e428]: Jan
                      - text: ：类 ChatGPT 界面，纯本地推理（基于 llama.cpp），也支持接远程 API。界面精美，Tauri 构建、体积小。注意其许可证带附加条款。
                    - listitem [ref=e429]:
                      - strong [ref=e430]: GPT4All
                      - text: ：老牌本地 GUI，支持商用。但仓库最后推送是 2025-05-27，
                      - strong [ref=e431]: 活跃度是明确风险
                      - text: ，新模型支持可能滞后，选它前请确认自己的模型是否在支持列表内。
                  - paragraph [ref=e432]:
                    - strong [ref=e433]: ③ 多模型聚合客户端（接 API 为主，也可接本地）
                  - list [ref=e434]:
                    - listitem [ref=e435]:
                      - strong [ref=e436]: Chatbox
                      - text: （GPL-3.0）：界面最简洁的"万能客户端"，一个对话里混用多家模型，iOS/桌面/Web 全平台。GPL 对个人使用无影响。
                    - listitem [ref=e437]:
                      - strong [ref=e438]: Cherry Studio
                      - text: （AGPL-3.0）：功能最重的国产项目，内置 300+ 助手模板、智能体（Claude Code、Codex、DeepSeek 等）、vibe coding 支持。AGPL 意味着你若二次开发并对外提供服务需开源，商用注意。
                  - paragraph [ref=e439]:
                    - strong [ref=e440]: ④ RAG / 智能体平台
                  - list [ref=e441]:
                    - listitem [ref=e442]:
                      - strong [ref=e443]: AnythingLLM
                      - text: （MIT，最宽松）：把文档喂给模型做知识库问答的成熟方案，支持向量库、多用户；适合企业或个人知识管理。
                    - listitem [ref=e444]:
                      - strong [ref=e445]: LobeHub
                      - text: ：定位已从聊天演变为"AI 团队运营平台"（Agent Operator），功能最前沿但主要为 Web 形态，桌面端是封装壳。
                  - paragraph [ref=e446]:
                    - strong [ref=e447]: ⑤ 值得关注的新兴项目
                    - text: （star 量级小，更新活跃）
                  - list [ref=e448]:
                    - listitem [ref=e449]:
                      - strong [ref=e450]: talkio
                      - text: （Tauri 2 + React）：本地优先的多模型群聊桌面应用，一个对话同时接入 GPT/Claude/Gemini/DeepSeek。
                    - listitem [ref=e451]:
                      - strong [ref=e452]: Chaty
                      - text: （Rust + TS）：设备端 GGUF/MLX 模型 + 本地编码智能体 + RAG + 深度研究。
                    - listitem [ref=e453]:
                      - strong [ref=e454]: Soul-of-Waifu
                      - text: ：带 Live2D/VRM 虚拟形象的 AI 角色扮演桌面应用（Python，1.2k star，昨日仍有更新）。
                  - heading "需要留意的坑" [level=2] [ref=e455]
                  - list [ref=e456]:
                    - listitem [ref=e457]:
                      - strong [ref=e458]: 许可证
                      - text: ：GitHub 上 Jan、LobeHub 的许可证被标记为 NOASSERTION（自定义条款），Cherry Studio 是 AGPL；个人/内部使用无碍，但
                      - strong [ref=e459]: 产品化、商用前务必核对 LICENSE 原文
                      - text: 。最省心的商用选择是 MIT 的 AnythingLLM 和 Ollama。
                    - listitem [ref=e460]:
                      - strong [ref=e461]: 活跃度
                      - text: ：GPT4All 14 个月无提交；Ollama、Cherry Studio、AnythingLLM 当日（2026-08-11）仍在推送，活跃度健康。
                    - listitem [ref=e462]:
                      - strong [ref=e463]: LM Studio 未纳入
                      - text: ：其仓库不存在（
                      - code [ref=e464]: lmstudio-ai/lmstudio
                      - text: 返回 404），确认是闭源软件，只是免费分发，不符合"开源"标准。
                  - paragraph [ref=e465]: 如果你有具体的使用场景（如完全离线、知识库、多模型聚合、商用），我可以基于此再给出针对性的配置建议。
