                      - text: ，默认
                      - strong [ref=f3e2779]: 不缓冲响应体
                      - text: ，SSE 的
                      - code [ref=f3e2780]: text/event-stream
                      - text: 分块可以实时转发，无需额外配置；
                    - listitem [ref=f3e2781]: 但要注意：如果后端 SSE 长连接 + 前端页面刷新，旧连接可能残留（HTTP/1.1 keep-alive 行为），开发期常见"重复事件"现象，这是连接管理问题而非 proxy 问题。
                  - heading "5. WebSocket 不适用" [level=3] [ref=f3e2782]
