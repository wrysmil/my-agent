                  - separator [ref=f3e2717]
                  - heading "二、proxy 解决了什么问题：开发期跨域" [level=2] [ref=f3e2718]
                  - paragraph [ref=f3e2719]:
                    - text: 浏览器直接
                    - code [ref=f3e2720]: fetch('http://localhost:4321/api/agents')
                    - text: 会因
                    - strong [ref=f3e2721]: 跨域
                    - text: 被拦：页面 origin 是
                    - code [ref=f3e2722]: http://localhost:5173
                    - text: ，目标 origin 是
                    - code [ref=f3e2723]: http://localhost:4321
                    - text: ，属于不同源，浏览器会先发 OPTIONS 预检，后端若未返回
                    - code [ref=f3e2724]: Access-Control-Allow-Origin
                    - text: 则请求失败。
                  - paragraph [ref=f3e2725]:
                    - text: proxy 的思路：
                    - strong [ref=f3e2726]: 请求不直接发给 4321，而是发给同源的 5173
                    - text: ，由 Vite 的 dev server 在
                    - strong [ref=f3e2727]: 服务端
                    - text: 转发到 4321。服务端转发不受浏览器同源策略约束，因此：
                  - list [ref=f3e2728]:
                    - listitem [ref=f3e2729]:
                      - text: 浏览器视角：所有请求都是
                      - code [ref=f3e2730]: http://localhost:5173/api/*
                      - text: ，同源，无 CORS 问题；
                    - listitem [ref=f3e2731]: 后端视角：请求来自 Vite dev server，普通 HTTP 转发，无需为开发场景写 CORS 中间件。
                  - paragraph [ref=f3e2732]:
                    - text: 前端代码因此可以统一写相对路径（本项目
                    - code [ref=f3e2733]: BASE_URL = ''
                    - text: ），
                    - strong [ref=f3e2734]: 开发和生产零改动
                    - text: 。
                  - separator [ref=f3e2735]
                  - heading [level=2] [ref=f3e2736]:
                    - text: 三、
                    - code [ref=f3e2737]: /api
                    - text: 代理的行为细节
                  - heading "1. 路径前缀默认保留，不重写" [level=3] [ref=f3e2738]
                  - paragraph [ref=f3e2739]:
                    - text: 简写字符串形式
                    - strong [ref=f3e2740]: 不会重写路径
                    - text: ，转发时保留完整
                    - code [ref=f3e2741]: /api
                    - text: 前缀：
                  - code [ref=f3e2743]: 浏览器 → GET http://localhost:5173/api/agents ↓ (Vite proxy) 后端 → GET http://localhost:4321/api/agents
                  - paragraph [ref=f3e2744]:
                    - text: 这恰好匹配本项目的后端路由设计（
                    - code [ref=f3e2745]: router.ts
                    - text: 的 21 个路由都以
                    - code [ref=f3e2746]: /api/
                    - text: 开头），所以是正确配置。
                  - paragraph [ref=f3e2747]:
                    - text: ⚠️ 对比：如果后端路由
                    - strong [ref=f3e2748]: 不带
                    - code [ref=f3e2749]: /api
                    - text: 前缀（如后端只有
                    - code [ref=f3e2750]: /agents
                    - text: ），就需要显式重写：
                  - code [ref=f3e2752]:
                    - text: "proxy: { '/api': { target: 'http://localhost:4321', rewrite:"
                    - generic [ref=f3e2753]: (path) =>
                    - text: "path.replace(/^\\/api/, ''), }, },"
                  - heading [level=3] [ref=f3e2754]:
                    - text: "2."
                    - code [ref=f3e2755]: changeOrigin
                    - text: 默认
                    - code [ref=f3e2756]: "false"
                    - text: （简写形式下）
                  - paragraph [ref=f3e2757]:
                    - text: 简写形式等价于
                    - code [ref=f3e2758]: "{ target: 'http://localhost:4321' }"
                    - text: ，
                    - code [ref=f3e2759]: changeOrigin
                    - text: 未设置。这意味着转发时
                    - strong [ref=f3e2760]:
                      - text: Host 请求头保持为
                      - code [ref=f3e2761]: localhost:5173
                    - text: 。
                  - paragraph [ref=f3e2762]: 对本项目影响不大（后端按端口路由，不看 Host），但如果后端依赖 Host 头做虚拟主机/域名校验，就需要显式开启：
                  - code [ref=f3e2764]: "'/api': { target: 'http://localhost:4321', changeOrigin: true, // 把 Host 改写为 localhost:4321 },"
                  - heading "3. 匹配规则：前缀匹配" [level=3] [ref=f3e2765]
                  - paragraph [ref=f3e2766]:
