                    - text: ：
                    - code [ref=f3e2769]: /api/agents
                    - text: 、
                    - code [ref=f3e2770]: /api/sessions/123/history
                    - text: 、
                    - code [ref=f3e2771]: /api/sessions/123/messages/stream
                    - text: 都会命中转发。精确匹配用
                    - code [ref=f3e2772]: "'^/api$'"
                    - text: （正则键）。本项目需要的是前缀匹配，正确。
                  - heading "4. SSE（流式响应）可以正常穿透" [level=3] [ref=f3e2773]
                  - paragraph [ref=f3e2774]:
                    - text: 本项目有
                    - code [ref=f3e2775]: "/api/sessions/{id}/messages/stream"
                    - text: （SSE 流），它经过 proxy 时：
                  - list [ref=f3e2776]:
