                        - paragraph [ref=f14e1243]: 我要覆盖：
                        - list [ref=f14e1244]:
                          - listitem [ref=f14e1245]: 为什么需要 proxy（开发环境跨域问题）
                          - listitem [ref=f14e1246]: 当前配置的行为机制（请求路径如何流转）
                          - listitem [ref=f14e1247]: 对前端开发的正面影响
                          - listitem [ref=f14e1248]: 需要注意的坑/边界情况（结合本项目）
                          - listitem [ref=f14e1249]: 与生产环境的对比（构建后 dist 如何工作）
                          - listitem [ref=f14e1250]: 可能的改进建议
                        - paragraph [ref=f14e1251]: 关键点：
                        - list [ref=f14e1252]:
                          - listitem [ref=f14e1253]:
                            - text: 开发时前端在 5173，后端在 4321，浏览器直接 fetch
                            - link "http://localhost:5173/api/xxx" [ref=f14e1254] [cursor=pointer]:
                              - /url: http://localhost:5173/api/xxx
                            - text: 会跨域（origin 5173 → 4321）。Vite proxy 把 /api 前缀请求转发到 4321，同时
                            - strong [ref=f14e1255]: 保持路径前缀
                            - text: （默认不重写），即
                            - code [ref=f14e1256]: /api/agents
                            - text: →
                            - code [ref=f14e1257]: http://localhost:4321/api/agents
                            - text: 。
                          - listitem [ref=f14e1258]: 后端在 4321 上 serve 静态文件（webRoot = web）加 API 路由，所以其实 4321 也能直接访问前端（构建产物）。生产模式是单端口：4321 同时提供静态资源和 API。
                          - listitem [ref=f14e1259]: 而开发模式下用 Vite dev server（5173）提供前端热更新，proxy 转发 API 到 4321。注意：4321 后端默认 host 127.0.0.1 仅本机。
                          - listitem [ref=f14e1260]:
                            - text: SSE（/messages/stream）通过 proxy 需要注意：http-proxy 对 SSE 的支持一般没问题（默认不缓冲），但要注意
                            - code [ref=f14e1261]: changeOrigin
                            - text: 、超时等。
                          - listitem [ref=f14e1262]:
                            - text: 当前配置是简写形式
                            - code [ref=f14e1263]: "'/api': 'http://localhost:4321'"
                            - text: ，等价于
                            - code [ref=f14e1264]: "{ target: 'http://localhost:4321', changeOrigin: true }"
                            - text: ？不对，简写字符串形式等价于
                            - code [ref=f14e1265]: "{ target: 'http://localhost:4321' }"
                            - text: ，changeOrigin 默认是 false。实际上 Vite 文档说字符串简写形式等价于
                            - code [ref=f14e1266]: "{ target: ... }"
                            - text: 。
                          - listitem [ref=f14e1267]: "changeOrigin 的影响：当 target 是 localhost 时，changeOrigin 影响不大；但如果后端通过 Host 头做虚拟主机路由，就需要 changeOrigin: true。"
                          - listitem [ref=f14e1268]:
                            - text: 路径保持：默认不重写，
                            - code [ref=f14e1269]: /api/foo
                            - text: →
                            - code [ref=f14e1270]: http://localhost:4321/api/foo
                            - text: 。这正是本项目的需求，因为后端路由本身就带 /api 前缀。
                          - listitem [ref=f14e1271]:
                            - text: 另一个常见模式是
                            - code [ref=f14e1272]: "rewrite: (path) => path.replace(/^\\/api/, '')"
                            - text: ，当后端不带 /api 前缀时用。本项目不需要。
                          - listitem [ref=f14e1273]:
                            - text: ws 支持：WebSocket 需要
                            - code [ref=f14e1274]: "ws: true"
                            - text: 。本项目用 SSE 而非 WebSocket，所以不需要，但值得一提。
                          - listitem [ref=f14e1275]:
                            - text: 生产构建后：
                            - code [ref=f14e1276]: "base: './'"
                            - text: + dist 被 4321 后端 serve，前端 fetch 相对路径
                            - code [ref=f14e1277]: /api/xxx
                            - text: 会直接打到 4321 同源，无跨域问题。这也解释了为什么 proxy 只在 dev 需要。
                          - listitem [ref=f14e1278]:
                            - text: 前端 fetch 使用相对路径
                            - code [ref=f14e1279]: /api/...
                            - text: （apiGet 等），这样 dev 和 prod 通用。
