sults with Apple Silicon M-series processors. See the full System Requirements for more details. Flathub (community maintained) Install GPT4All Python gpt4all gives you access to LLMs with our Python client around llama.cpp implementations. Nomic contributes to open source software like llama.cpp to make LLMs accessible and efficient for all . pip install gpt4all from gpt4all import GPT4All model = GPT4All ( \"Meta-Llama-3-8B-Instruct.Q4_0.gguf\" ) # downloads / loads a 4.66GB LLM with model . chat_session (): print ( model . generate ( \"How can I run LLMs efficiently on my laptop?\" , max_tokens = 1024 )) Integrations 🦜🔗 Langchain 🗃️ Weaviate Vector Database - module docs 🔭 OpenLIT (OTel-native Monitoring) - Docs Release History July 2nd, 2024 : V3.0.0 Release Fresh redesign of the chat application UI Improved user workflow for LocalDocs Expanded access to more model architectures October 19th, 2023 : GGUF Support Launches with Support for: Mistral 7b base model, an updated model gallery on our website, several new local code models including Rift Coder v1.5 Nomic Vulkan support for Q4_0 and Q4_1 quantizations in GGUF. Offline build support for running old versions of the GPT4All Local LLM Chat Client. September 18th, 2023 : Nomic Vulkan launches supporting local LLM inference on NVIDIA and AMD GPUs. July 2023 : Stable support for LocalDocs, a feature that allows you to privately and locally chat with your data. June 28th, 2023 : Docker-based API server launches allowing inference of local LLMs from an OpenAI-compatible HTTP endpoint. Contributing GPT4All welcomes contributions, involvement, and discussion from the open source community! Please see CONTRIBUTING.md and follow the issues, bug reports, and PR markdown templates. Check project discord, with project owners, or through existing issues/PRs to avoid duplicate work. Please make sure to tag all of the above with relevant project identifiers or your contribution could potentially get lost. Example tags: backend , bindings , python-bindings , documentation , etc. Citation If you utilize this repository, models or data in a downstream project, please consider citing it with: @misc{gpt4all, author = {Yuvanesh Anand and Zach Nussbaum and Brandon Duderstadt and Benjamin Schmidt and Andriy Mulyar}, title = {GPT4All: Training an Assistant-style Chatbot with Large Scale Data Distillation from GPT-3.5-Turbo}, year = {2023}, publisher = {GitHub}, journal = {GitHub repository}, howpublished = {\\url{https://github.com/nomic-ai/gpt4all}}, } About GPT4All: Run Local LLMs on Any Device. Open-source and available for commercial use. nomic.ai/gpt4all Topics ai-chat llm-inference Resources Readme MIT license Contributing Contributing Activity Custom properties Stars 77.4k stars Watchers 698 watching Forks 8.3k forks Report repository Releases Packages Used by Contributors Languages Footer &copy; 2026 GitHub, Inc. Footer navigation Terms Privacy Security Status Community Docs Contact Manage cookies Do not share my personal information You can’t perform that action at this time."
