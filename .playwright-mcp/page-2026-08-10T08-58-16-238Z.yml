              - paragraph [ref=f5e190]
              - paragraph [ref=f5e192]: 生成的可视化网页：https://www.kimi.com/preview/d1e2ujo52cekgv1uhep0?blockId=18
              - heading "3、Kimi从发布到今天的月活用户变化" [level=3] [ref=f5e193]
              - paragraph [ref=f5e194]: 提示词：
              - blockquote [ref=f5e195]:
                - paragraph [ref=f5e196]: Kimi AI发展情况是怎么样的？它的月活用户量变动情况如何？未来它有可能怎么样发展？请从Kimi的发布时间开始算起，直到今天2025年6月24日，参考可靠来源， 从多视角、多维度进行深度研究，为我生成报告。
              - paragraph [ref=f5e197]: Kimi确认需求：
              - paragraph [ref=f5e198]
              - paragraph [ref=f5e200]: 我的回复：
              - paragraph [ref=f5e201]
              - paragraph [ref=f5e203]: 生成的可视化网页：https://www.kimi.com/preview/d1e36njlmiuf20s294n0?blockId=38
              - paragraph [ref=f5e204]
              - paragraph [ref=f5e206]: 在这当中，Kimi-Research出现了一个很有意思的行为：它在没有任何干预的情况下，察觉到了代码存在问题，所以果断放弃了代码，选择了直接撰写报告。
              - paragraph [ref=f5e207]: 具体为什么会这样？
              - paragraph [ref=f5e208]: 所谓“知其然知其所以然”，在研读了月之暗面发布的技术解析博客后，我想试试看，用大家能听得懂的语言，来为大家讲解，在发起任务到完成交付的过程中，Kimi的这个Agent，用了怎么样的技术，如果有不完全的地方，请大家见谅哈~
              - heading "四、技术原理解析" [level=2] [ref=f5e209]
              - heading "1、端到端自主强化学习" [level=3] [ref=f5e210]
              - paragraph [ref=f5e211]: 首先，我们应该知道，什么是“端到端”，指的是“用户输入”到“交付结果”中间，没有任何的人工干预，也不出现既定的套路模板，而是由Agent自行完成。Open AI的深度研究也采用了这样的方式。
              - paragraph [ref=f5e212]: 其次，“自主强化学习”，指的是模型能够自动调用相关的工具，并且根据任务的进度能够自行判断哪个工具最为合适，不依赖我们的提示词，自己就能够走完全程。
              - heading "2、奖励机制" [level=3] [ref=f5e213]
              - paragraph [ref=f5e214]: 这是强化学习中很重要的一个概念。它能够帮助模型分辨“好”与“不好”。
              - paragraph [ref=f5e215]: 为什么会这样？
              - paragraph [ref=f5e216]: 在一开始的时候，就由人工进行标注，让人类为模型的回答打分。
              - paragraph [ref=f5e217]: 例如，面对“今晚去哪里吃饭”这个问题，模型给出的回答是“去找家餐厅吧”，对这个回答给予高分；而对“去厕所”这个回答给予低分，这样就得到了原始的标注好的数据。
              - paragraph [ref=f5e218]: 再根据标注好的数据，来训练一名“打分员”（奖励模型），让模型自己来判断好与不好。每次生成回答后，“打分员”会对回答进行打分，模型再根据回答调整自己的解题思路（参数），这个过程中，模型的回答会越来越偏向于人类满意的回答，这个过程就叫“强化学习”。
              - paragraph [ref=f5e219]: 而在Kimi-Researcher中，使用的奖励机制是两种：
              - list [ref=f5e220]:
                - listitem [ref=f5e221]: · 格式奖励：每当模型的操作不符合“操作手册”的规范，它就会被扣钱（获得负奖励），从而帮助它的操作具有规范性和有效性，变成一名听话的好员工。
                - listitem [ref=f5e222]: · 正确性奖励：基于格式奖励，对于模型符合操作规范的情况，将它最终输出的答案与标准答案进行比较，这就促使它的每一步都是为了产生更好的。
              - paragraph [ref=f5e223]: 然而，对于操作流程完全正确，答案符合标准的两条答复，路径较短、更高效的回答，会在一开始就能够得到奖励，从而帮助模型能够更加有效率的完成任务。
              - heading "3、上下文管理" [level=3] [ref=f5e224]
              - paragraph [ref=f5e225]: 对于更复杂、流程更繁琐的任务，模型引入了上下文管理的方法，它就像聪明的学生，并不是每条消息都去记，而是会选择更重要的，丢弃不必要的，从而有选择性地去记忆，这样就能获取更多信息，实现更高的性能。
              - heading "4、并行工具调用" [level=3] [ref=f5e226]
              - paragraph [ref=f5e227]: 为了完成任务，Kimi-Researcher携带了三样工具。
              - list [ref=f5e228]:
                - listitem [ref=f5e229]: · 并行的实时内部搜索工具：可以同时发起多个请求，缩短信息检索的时间，从而更高效地找到答案，如果任务需要大量背景信息、专业知识，或者是某些特定的数据，这个工具是很关键的。
                - listitem [ref=f5e230]: · 用于交互式网页任务，基于文本的浏览器工具：它会模拟人类在网页上的操作，例如点击链接、提取特定区域的内容，使得模型能够在一些交互式的网页中提取数据。
                - listitem [ref=f5e231]: · 用于自动执行代码的编码工具：还记得刚刚截图里我们看到的使用python编码的操作吗？它就是来自于这个编码工具，它赋予了模型计算能力和数据处理能力，可以运行python代码，对于收集到的数据进行分析和处理。
              - paragraph [ref=f5e232]: 而这三个工具，都被放置在端到端的自主强化学习框架下，供模型自己选择什么时候用什么工具，能够更好完成任务。
              - heading "五、怎么样才能用上？" [level=2] [ref=f5e233]
              - paragraph [ref=f5e234]: 目前，Kimi官网已经开放了对Kimi-Research的内测申请。
              - paragraph [ref=f5e235]: 电脑进入Kimi官方网站：https://www.kimi.com/
              - paragraph [ref=f5e236]: 在输入框下方，点击“申请Kimi Research内测”：
              - paragraph [ref=f5e237]
              - paragraph [ref=f5e239]: 现在通过的时间应该蛮快的，不会超过半天，你填写的手机号会收到一条短信，告诉你申请通过。
              - paragraph [ref=f5e240]: 再次进入官网，你会发现，输入框里多了一个按钮：
              - paragraph [ref=f5e241]
              - paragraph [ref=f5e243]: 这就说明你已经可以用Kimi-Research，为你完成任务了。
              - paragraph [ref=f5e244]: 需要注意的是，每个月20次使用额度，别一不小心就用完了~
              - paragraph [ref=f5e245]: Kimi-Research虽好，可别贪用哦~
              - paragraph [ref=f5e246]: 谁需要Kimi-Research？
              - paragraph [ref=f5e247]: 如果你是一名学生，你可以用它来帮你搞懂复杂难懂的概念，让Kimi来当你的老师，陪伴你在学习道路上过五关斩六将；
              - paragraph [ref=f5e248]: 如果你是数据分析从业者，那就更好办了——Kimi会帮你自动筛除掉那些无用的、低质量的信源，采用高质量的、有效的，对你需要整合的数据进行深入分析；
              - paragraph [ref=f5e249]: 如果你是一名学术研究人员，或者正在撰写学术论文，你可以让Kimi来帮你查找可靠的资料，省去你辛苦跑知网、维普、万方，查找、阅读论文的时间；
              - paragraph [ref=f5e250]: 如果你是酷爱冲浪的选手，你也可以用Kimi，轻松得知一个梗的前世今生，就像我用它来分析为什么那艺娜会那么火的原因一样，让你轻松踩在浪潮前端，打破信息差，不掉队。
              - paragraph [ref=f5e251]: ….
              - paragraph [ref=f5e252]: 更多好玩的场景，等你来发现。
              - heading "六、Kimi，尚能饭否？" [level=2] [ref=f5e253]
              - paragraph [ref=f5e254]: 在以上的内容中，我们一起跑了几个任务，但是我心中仍旧有所怀疑，那就是：它和传统意义上的深度研究，区别在哪？官方说它是一个Agent，真的做到了吗？
              - paragraph [ref=f5e255]: 于是，我把这个问题扔给了ChatGPT。
              - paragraph [ref=f5e256]
              - paragraph [ref=f5e258]: 它对于Agent的定义，有点意思。
              - paragraph [ref=f5e259]: ChatGPT认为，合格的Agent应该做到五个方面，将单词“Agent”拆分开来：
              - paragraph [ref=f5e260]: 🐏
              - paragraph [ref=f5e261]: A-G-E-N-T
              - paragraph [ref=f5e262]: Awareness（有感知）:能识别用户意图，哪怕用户没说，它也能做得好。能理解上下文，也能看懂网页，读懂文档。
              - paragraph [ref=f5e263]: Goal-oriented（有目标）：并不是像无头苍蝇一样到处乱转，而是有着清晰的结果导向，并且为了达到目标，而调用自身一切的资源。
              - paragraph [ref=f5e264]: Execution（能行动）：能操作工具，完成任务。
              - paragraph [ref=f5e265]: Navigation（能规划路径）：不只是将大目标拆分为子任务，而是有规划的去执行，不墨守成规。
              - paragraph [ref=f5e266]: Tuning（能自我调整）：面对查询到的数据有冲突，策略有错误的时候，它不钻牛角尖，而是自己做决定，选择更好的方案。
              - paragraph [ref=f5e267]: 那从这一点看来，Kimi发布的首个Agent，确实成了。
              - paragraph [ref=f5e268]: 为什么Kimi的第一个Agent，要做Researcher，这个看似好像没有必要再继续扩展的赛道？
              - paragraph [ref=f5e269]: 官方的一句话，让我泪目：
              - paragraph [ref=f5e270]
              - paragraph [ref=f5e272]: 并且，在不久的将来，Kimi-Researcher 的基础预训练模型以及其背后的强化学习模型，会被开源出来，让我们每个人都实现“研究自由”。
              - paragraph [ref=f5e273]: Kimi，尚能饭否？
              - paragraph [ref=f5e274]: 答案是：能！并且肯定会继续变好。
              - paragraph [ref=f5e275]: 让我们期待，Kimi重现辉煌的那一天。
              - paragraph [ref=f5e276]: 感谢你的观看，如果你觉得这篇文章有帮到你，是我的荣幸~
              - paragraph [ref=f5e277]: 欢迎点赞、推荐、转发给你那还在为了论文、为了报告而焦头烂额的朋友。
              - paragraph [ref=f5e278]: 如果你也用Kimi-Researcher整了更好玩的活，欢迎在评论区分享~
