              - paragraph [ref=f5e74]
              - paragraph [ref=f5e76]: 最近有个问题，一直在困扰着我：为什么杭州和北京的AI公司那么多，而其他地方的相对就更少呢？
              - paragraph [ref=f5e77]: 正好当时我申请内测的Agent通过了，于是我就用它跑了一个深度研究的任务，然后就电脑就挂在那，干别的事情去了。
              - paragraph [ref=f5e78]: 当我再次点开它的界面之后，任务已经完成了，还为我生成了一份可视化的报告：
              - paragraph [ref=f5e79]
              - paragraph [ref=f5e81]: 这是那份报告的头图。
              - paragraph [ref=f5e82]: 讲真的，看到这张图片的那一刻，我脑中浮现了两个字——
              - paragraph [ref=f5e83]: “精彩”。
              - heading "一、Kimi的荣耀与滑铁卢" [level=2] [ref=f5e84]
              - paragraph [ref=f5e85]: 如果你问我，国产AI这么多，哪一款让我最觉得可惜，我会告诉你，是Kimi。
              - paragraph [ref=f5e86]: 在早期，这个AI是我使用的最多，也认为是最好用的。
              - paragraph [ref=f5e87]: 无他，因为它的长文本处理能力，在2024年的国产大模型中，堪称顶流。
              - paragraph [ref=f5e88]: 2023年10月，Kimi AI首次亮相，它主打的20万字上下文长度在当时已经是一个足够惊艳的数字。之后的几个月里，Kimi AI 的月活跃用户（MAU）持续增长，从50万到298万，从2023年12月到2024年2月，只用了3个月时间。
              - paragraph [ref=f5e89]: 而它背后的公司——月之暗面，也开始走入人们的视野。
              - paragraph [ref=f5e90]: 2024年3月，月之暗面宣布Kimi支持200万字的无损上下文输入，引起了一波轰动，在5个月时间内，上下文长度提升10倍，同时也引起了同行在长文本领域的“内卷”，各大互联网厂商纷纷跟进，开启了“军备竞赛”式的竞争,Kimi也及时在B站投流，实现了用户的快速增长。
              - paragraph [ref=f5e91]: 之后的几个月里，Kimi的月活跃用户持续攀升，到2024年11月，据创始人杨植麟所说，已经达到了3600万。
              - paragraph [ref=f5e92]: 按理说，如此猛的势头，Kimi应该继续牛逼下去，直到“封神”。
              - paragraph [ref=f5e93]: 可是，在2025年，Kimi却遭遇了它最为强力的竞争对手。
              - paragraph [ref=f5e94]: 2025年初，DeepSeek（深度求索）横空出世，凭借开源+强大的技术实力，直接打击了包括Kimi在内的一众竞品。
              - paragraph [ref=f5e95]: 2025年3月，DeepSeek月活跃用户数达到1.94亿，位居AI原生APP榜首，而Kimi的月活跃用户则是从顶峰时期的3600万下滑到了1830万，位居第四。
              - paragraph [ref=f5e96]: 在国内AI用户甚至是普通民众的口中，“DeepSeek”成为了大家口中频繁出现的词汇，AI顶流的代名词，直到今天。
              - paragraph [ref=f5e97]: 而Kimi呢？
              - paragraph [ref=f5e98]: 仿佛它的高光时刻，已经过去，沦为了众多新兴AI的垫脚石。
              - paragraph [ref=f5e99]: 我个人就有很深的体会，说实话，我已经很久没有点开Kimi的网页或者APP了。
              - paragraph [ref=f5e100]: 去年3月，Kimi风光无限，今年3月，Kimi却没能够再次震撼世界。
              - paragraph [ref=f5e101]: 然而，在AI圈大战没落下帷幕的时候，乾坤未定，一切皆有可能。
              - paragraph [ref=f5e102]: 6月20号，月之暗面官方发布的一篇文章，让我忍不住感叹：原来不是Kimi握不动刀了，而是它拿起了板砖！
              - heading "二、Kimi-Researcher，专为深度研究而生的Agent" [level=2] [ref=f5e103]
              - heading "1、你是否也有同感？" [level=3] [ref=f5e104]
              - paragraph [ref=f5e105]: GDR（Google DeepResearch）一直是我很喜欢用的一个产品，动辄输出十多页、二十多页的报告，总让我有种莫名的“量大管饱”的满足感…
              - list [ref=f5e106]:
                - listitem [ref=f5e107]: · 不过，如果要说它有什么地方有待改进的话，作为资深用户，我还是能提几个出来的：对网络环境要求极高…大家都知道，由于Gemini是国外的AI，所以如果要使用它的话，不得不用些特殊手段，这点就在无形当中制造了门槛；
                - listitem [ref=f5e108]: · 当你发出指令的时候，它会先列出执行步骤给你确认，但是假如我们自己都没想清楚，那自然也没有办法进行修正，这种感觉，就像点外卖的时候没选择“需要餐具”一样尴尬…
                - listitem [ref=f5e109]: · 它开始干活的时候，真的是很严格地在按照流程来执行，但是有时候太“按规矩办事”，反而失去了一些灵动感，毕竟…哪位老板希望自己的员工只像老黄牛一样吭哧吭哧地埋头苦干呢…
              - paragraph [ref=f5e110]: 但是这丝毫不影响我对Gemini的爱，充其量只是相当于，喜欢的女孩脸上长了青春痘，虽然影响了美貌，但是无伤大雅…
              - paragraph [ref=f5e111]: 不过总是有些遗憾。
              - heading "2、Kimi-Researcher，来了。" [level=3] [ref=f5e112]
              - paragraph [ref=f5e113]: 上周五，朋友群里转发了一篇来自Kimi官方的公众号文章，就讲了一件事——他们发布了一款专门为了深度研究而生的Agent，并且现在开始了内测。
              - paragraph [ref=f5e114]: 这一下，好像平静的水面投入了一颗巨石，激起千层浪…群炸了。
              - paragraph [ref=f5e115]: 我也在第一时间就申请了内测。
              - paragraph [ref=f5e116]: 我也忘了是多久，反正就不超过一天的时间，当我再次点进Kimi官网的时候，输入框下面就出现了一个“深度研究”的按钮。
              - paragraph [ref=f5e117]: 最近AI的活动贼多，群里几乎每天都能收到“某某AI举办活动，地址在北京/杭州”这样的消息。
              - paragraph [ref=f5e118]: 每次有朋友说自己要去的时候，我内心都涌现出一堆很复杂的情绪，总结两个字：“羡慕”。
              - paragraph [ref=f5e119]: 所以，我稍加思索之后，就输入了这段话：
              - paragraph [ref=f5e120]: 引用可靠来源，经过多角度，多维度的分析，告诉我以下答案：
              - paragraph [ref=f5e121]: 为什么AI公司基本都开在北京和杭州？
              - paragraph [ref=f5e122]: Kimi给我的回复是这样的：
              - paragraph [ref=f5e123]
              - paragraph [ref=f5e125]: 我们可以看到，它不是着急干活，而是要先向我确认我的具体需求。
              - paragraph [ref=f5e126]: 这一步骤，叫做“澄清问题”。是当它理解问题时，主动反问，向用户做确认，有的放矢。
              - paragraph [ref=f5e127]: 其实我很怕麻烦，如果可以，我真想要的是当一名“甩手掌柜”，完全不插手，不参与。
              - paragraph [ref=f5e128]: 但是这明显不太可能。
              - paragraph [ref=f5e129]: 因为一旦我真的当了甩手掌柜，那么结果就完全不是我可以控制的，甚至可能输出一份与我的要求不符合的报告，不仅白白浪费时间，还给自己找罪受….
              - paragraph [ref=f5e130]: 但是如果你要我说出个一二三来，准确表达我的需求，这又有点为难我了。
              - paragraph [ref=f5e131]: Kimi-Researcher直接像一名称职的助理一样，直接列出需要关注的点，让我自己选择，有了这一步操作，起码能够保证这份报告具有一定的聚焦。
              - paragraph [ref=f5e132]: 然后，我就告诉它：
              - paragraph [ref=f5e133]
              - paragraph [ref=f5e135]: 其实这一步我是感觉有些惊讶的。
              - paragraph [ref=f5e136]: 因为我自己都没注意到，我提出的“AI公司”这个概念太庞大了，但是Kimi注意到了，并且还向我发起了提问。
              - paragraph [ref=f5e137]: 那在之后的时间里，我原本应该去干自己的事儿，坐等报告就好，但是奈何Kimi Research执行任务的过程太精彩了，比小说还好看，一下子就吸引了我的眼球。
              - paragraph [ref=f5e138]: 直到这里，我才想起，Kimi-Research，它就是一个Agent啊！
              - paragraph [ref=f5e139]
              - paragraph [ref=f5e141]: Kimi-Research并没有选择一条道走到黑——只关注在这些特定问题上不懂变通，而是学会了自己思考。
              - paragraph [ref=f5e142]: 这个部分，是它的深入思考：能够自主梳理并理解需求，在这当中，我们只需要帮助它锚定需要聚焦的点就可以，其他的让其自由发挥。
              - paragraph [ref=f5e143]: 我们同样，也能看到，它其实是有在提取关键词，根据关键词进行搜索的，而且它能够筛选，把那些信息质量高的来源主动摘取出来，作为报告的引用源。
              - paragraph [ref=f5e144]: 而这，是它任务步骤中的“主动搜索”。
              - paragraph [ref=f5e145]: 它在不需要人工干预的情况下，经过推理之后自行采取更加合理的策略，使用更加高质量的搜索来源。
              - paragraph [ref=f5e146]: 在经过不算太漫长的等待，大约5分钟左右之后，这份由我+Kimi-Research共同撰写的研究报告就完成了。
              - paragraph [ref=f5e147]: 在这过程中，它出现了明显的自主性，调用合适的工具完成任务，交付结果。
              - paragraph [ref=f5e148]: 随之输出的，不仅是一份文字报告，还有一份网页的可视化报告。
              - paragraph [ref=f5e149]: 仔细看这份文字报告，它不止有文字，它还在每个引用的地方标注了参考来源。当我们点击文字旁边的方块后，在右侧会跳转到对应的引用内容，并且对于它引用的部分，还进行了高亮处理。
              - paragraph [ref=f5e150]
              - paragraph [ref=f5e152]: 点进它引用的文章，跳转页面，我们又能看到一个细节：
              - paragraph [ref=f5e153]
              - paragraph [ref=f5e155]: 它从哪段开始引用的，在来源的网页里，也给你标出来了。
              - paragraph [ref=f5e156]: 仿佛真的是一名严谨专业的研究员。
              - paragraph [ref=f5e157]: 而且….
              - paragraph [ref=f5e158]: 我写论文的时候，也没有这么严谨好吧。
              - paragraph [ref=f5e159]: 真正的做到了“可溯源”，确保了信息来源的可靠性。
              - paragraph [ref=f5e160]: 在以前，为了防止AI随意杜撰，捏造一些不存在的网页，我都会在提示词上加一段：“引用可靠的来源，不要随意杜撰”。
              - paragraph [ref=f5e161]: 但是现在，完全不需要了。
              - paragraph [ref=f5e162]: 因为Kimi会自己帮助你验证这些网站的可靠性，这就是它“懂我们没说的”。
              - paragraph [ref=f5e163]: 完整的文字报告太长了，我就不放了，大家可以在评论区回复，我会私发给你。
              - paragraph [ref=f5e164]: 可视化报告如下：
              - paragraph [ref=f5e165]: 网页链接：https://www.kimi.com/preview/d1e1ln9sfuve986n5brg?blockId=18
              - paragraph [ref=f5e166]: 在这个网页里，我们能看到，它的左边是有目录的，点击就能够跳转到对应章节。而且对于有需要的地方，它能够帮你绘制表格，形状，而且样式还特别精美，保证你看了之后不会想打瞌睡。
              - paragraph [ref=f5e167]
              - paragraph [ref=f5e169]: 只因你…你的报告，你做主。
              - paragraph [ref=f5e170]: 考虑到大家的观感…请点击上面的网页移步观看，记得回来，因为精彩的内容，才刚刚开始。
              - heading "三、案例测试" [level=2] [ref=f5e171]
              - paragraph [ref=f5e172]: 之后，我又跑了好几个案例，我将它的问题澄清部分和我的回复都放在下面，是不是够强大，有没有严格遵循我的指令，交给朋友们来评判，如果你要文字版本，欢迎在评论区留言：
              - heading "1、提示词的输入对AI输出结果的决定作用" [level=3] [ref=f5e173]
              - paragraph [ref=f5e174]: 提示词：提示词的输入对于AI的输出结果起到怎么样的作用？请参考可靠的信息来源，从多方查证后，为我输出一份深度研究的报告。
              - paragraph [ref=f5e175]: Kimi确认需求：
