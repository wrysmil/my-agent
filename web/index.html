<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>my-agent</title>
  <meta name="description" content="my-agent 本地 Web 前端 — 与 CLI 等价的浏览器界面" />
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Vendor（DOMPurify v3 + marked v12，SRI 在 F2 WU 加 integrity/crossorigin） -->
  <script src="./js/vendor/dompurify.min.js" defer></script>
  <script src="./js/vendor/marked.min.js" defer></script>
</head>
<body>
  <!-- 跳过导航，首焦点元素：键盘用户 Tab 一次即可直达 main-content -->
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <!-- 顶栏（sticky, role=banner） -->
  <header role="banner" class="app-header">
    <h1 class="app-title">my-agent</h1>
    <nav aria-label="顶栏导航" class="app-header-nav">
      <button type="button" data-action="toggle-theme" aria-label="切换主题">主题</button>
      <button type="button" data-action="open-settings" aria-label="打开设置">设置</button>
    </nav>
  </header>

  <!-- 布局：侧边栏 + 主内容 + 底部 -->
  <div class="app-shell">
    <!-- 侧边栏（role=complementary）：主菜单入口 + 会话列表 + 设置入口 -->
    <aside role="complementary" aria-label="侧边栏" class="app-sidebar">
      <nav aria-label="主导航" class="sidebar-primary">
        <ul role="list" class="sidebar-nav-list">
          <li><a href="#view=main-menu" data-view="main-menu">主菜单</a></li>
          <li><a href="#view=chat" data-view="chat">对话</a></li>
          <li><a href="#view=sessions" data-view="sessions">历史会话</a></li>
          <li><a href="#view=providers" data-view="providers">提供商</a></li>
          <li><a href="#view=agents" data-view="agents">子 Agent</a></li>
        </ul>
      </nav>

      <section aria-label="会话列表" class="sidebar-sessions">
        <h2 class="sidebar-section-title">会话</h2>
        <ul role="list" id="session-list" class="sidebar-session-list">
          <!-- F10 sessions.js 动态渲染 -->
        </ul>
        <button type="button" data-action="new-session" class="sidebar-new-session">+ 新会话</button>
      </section>

      <div class="sidebar-footer">
        <button type="button" data-action="open-settings" class="sidebar-settings-link">设置</button>
        <button type="button" data-action="quit" class="sidebar-quit-link">退出</button>
      </div>
    </aside>

    <!-- 主内容区（role=main）：Bento Grid / Chat / Providers / Agents / Settings 等 panel 容器 -->
    <main id="main-content" role="main" tabindex="-1" class="app-main">
      <h1 tabindex="-1" class="app-main-heading">my-agent 控制台</h1>

      <!-- 当前 provider 状态条（F15 app.js 启动时填充） -->
      <section aria-label="当前提供商状态" class="provider-status-bar" id="provider-status-bar">
        <span class="provider-status-placeholder">正在加载提供商状态…</span>
      </section>

      <!-- Panel 容器：F7 panels.js 切换 display；初始仅 main-menu 可见 -->
      <section aria-label="主菜单" id="panel-main-menu" class="panel" data-panel="main-menu">
        <h2 class="panel-title">主菜单</h2>
        <p class="panel-hint">使用方向键 / 数字键 1-6 选择，或鼠标点击卡片。</p>
        <div class="bento-grid" id="bento-grid">
          <!-- F8 menu.js 渲染 6 张 MenuCard -->
        </div>
      </section>

      <section aria-label="对话" id="panel-chat" class="panel" data-panel="chat" hidden>
        <h2 class="panel-title">对话</h2>
        <div class="chat-toolbar">
          <span class="chat-session-label" id="chat-session-label">Session: —</span>
          <button type="button" data-action="new-chat" aria-label="新建对话">新建对话</button>
          <button type="button" data-action="stop-stream" aria-label="停止生成">停止</button>
        </div>
        <div class="chat-transcript" id="chat-transcript" role="log" aria-live="polite" aria-relevant="additions">
          <!-- F11 chat.js 渲染消息流（含 Markdown + 工具卡片） -->
        </div>
        <form class="chat-composer" id="chat-composer" aria-label="消息输入">
          <label for="chat-input" class="visually-hidden">输入消息</label>
          <textarea id="chat-input" rows="3" placeholder="输入消息（Cmd/Ctrl+Enter 发送，Cmd/Ctrl+. 停止）"></textarea>
          <button type="submit" data-action="send-message">发送</button>
        </form>
      </section>

      <section aria-label="提供商设置" id="panel-providers" class="panel" data-panel="providers" hidden>
        <h2 class="panel-title">提供商设置</h2>
        <div id="providers-table-region">
          <!-- F9 providers.js 渲染 Provider 表格 + 编辑表单 -->
        </div>
      </section>

      <section aria-label="子 Agent 管理" id="panel-agents" class="panel" data-panel="agents" hidden>
        <h2 class="panel-title">子 Agent</h2>
        <div id="agents-list-region">
          <!-- F12 agents.js 渲染 builtin + user agents -->
        </div>
      </section>

      <section aria-label="技能" id="panel-skills" class="panel" data-panel="skills" hidden>
        <h2 class="panel-title">技能</h2>
        <div id="skills-list-region">
          <!-- F13 skills.js 渲染 skill 列表 + 详情 Modal -->
        </div>
      </section>

      <section aria-label="设置" id="panel-settings" class="panel" data-panel="settings" hidden>
        <h2 class="panel-title">设置</h2>
        <div id="settings-region">
          <!-- F14 settings.js 渲染主题切换 + 端口信息 -->
        </div>
      </section>

      <!-- Slash Modal 挂载点（F18 slash.js + 9 个 Modal 渲染） -->
      <div id="modal-root" aria-live="polite"></div>

      <!-- Toast 单例挂载点（F6 Toast.js） -->
      <div id="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>
    </main>
  </div>

  <!-- 底部（role=contentinfo） -->
  <footer role="contentinfo" class="app-footer">
    <small>my-agent Web · 端口 <span id="footer-port">5173</span> · <span id="footer-version">v0.0.0</span></small>
  </footer>

  <!-- ===== 脚本顺序加载（全部 defer；F15 启动前不得有副作用） ===== -->
  <!-- shared（顺序：utils → api → i18n → theme → icons） -->
  <script src="./js/shared/utils.js" defer></script>
  <script src="./js/shared/api.js" defer></script>
  <script src="./js/shared/i18n.js" defer></script>
  <script src="./js/shared/theme.js" defer></script>
  <script src="./js/shared/icons.js" defer></script>

  <!-- state -->
  <script src="./js/state/state.js" defer></script>

  <!-- components（13 个基础组件；F6 WU 落地） -->
  <script src="./js/components/Button.js" defer></script>
  <script src="./js/components/Card.js" defer></script>
  <script src="./js/components/Input.js" defer></script>
  <script src="./js/components/Modal.js" defer></script>
  <script src="./js/components/Toast.js" defer></script>
  <script src="./js/components/Skeleton.js" defer></script>
  <script src="./js/components/EmptyState.js" defer></script>
  <script src="./js/components/ErrorState.js" defer></script>
  <script src="./js/components/Tabs.js" defer></script>
  <script src="./js/components/Tooltip.js" defer></script>
  <script src="./js/components/ConfirmDialog.js" defer></script>
  <script src="./js/components/DropdownMenu.js" defer></script>
  <script src="./js/components/MenuCard.js" defer></script>

  <!-- sidebar + panels（F7 WU；面板切换 / 焦点移到 h1） -->
  <script src="./js/components/sidebar.js" defer></script>
  <script src="./js/components/panels.js" defer></script>

  <!-- features（按业务依赖：sessions → chat → menu/providers/agents/skills/settings → slash） -->
  <script src="./js/features/sessions.js" defer></script>
  <script src="./js/features/chat.js" defer></script>
  <script src="./js/features/menu.js" defer></script>
  <script src="./js/features/providers.js" defer></script>
  <script src="./js/features/agents.js" defer></script>
  <script src="./js/features/skills.js" defer></script>
  <script src="./js/features/settings.js" defer></script>
  <script src="./js/features/theme.js" defer></script>
  <script src="./js/features/slash.js" defer></script>

  <!-- Slash Modal 组件（F18 WU；9 个 Modal） -->
  <script src="./js/components/HelpModal.js" defer></script>
  <script src="./js/components/HistoryModal.js" defer></script>
  <script src="./js/components/ToolsModal.js" defer></script>
  <script src="./js/components/SkillsModal.js" defer></script>
  <script src="./js/components/SkillDetailModal.js" defer></script>
  <script src="./js/components/AgentsModal.js" defer></script>
  <script src="./js/components/ProviderModal.js" defer></script>
  <script src="./js/components/CompactModal.js" defer></script>
  <script src="./js/components/UsageModal.js" defer></script>

  <!-- 启动入口（F15 WU；三段流水线 + 全局错误捕获） -->
  <script src="./js/app.js" defer></script>
</body>
</html>
